name: codereader-server

services:
  codereader-server:
    image: codereader-server:latest
    container_name: codereader-server
    build: .
    ports:
      - "3011:3011"
    environment:
      NODE_ENV: production
      PORT: "3011"
      DATABASE_PATH: /data/database.sqlite
      FIREBASE_PROJECT_ID: general-2ed6c
    volumes:
      - ./data:/data
    restart: unless-stopped
