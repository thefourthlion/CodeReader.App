name: codereader-client

services:
  codereader-client:
    image: codereader-client:latest
    container_name: codereader-client
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.codereader.app
    ports:
      - "3010:3010"
    restart: unless-stopped
